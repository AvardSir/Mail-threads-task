version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailthreads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  provider:
    image: gitea.teamlead.one/armanteam_public/mail-provider:1
    container_name: mail-provider
    environment:
      CANDIDATE: ${CANDIDATE}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on: []

volumes:
  postgres_data: